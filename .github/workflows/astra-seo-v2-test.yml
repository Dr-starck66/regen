name: ASTRA SEO Lab V2 Test

on:
  push:
    branches: [astra-seo-free]
    paths:
      - 'astra-seo-free/**'
      - '.github/workflows/astra-seo-v2-test.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: astra-seo-free
        run: npm install
      - name: Syntax check
        working-directory: astra-seo-free
        run: node --check server.js
      - name: Unit test Bing redirect unwrap
        working-directory: astra-seo-free
        run: |
          node --input-type=module <<'NODE'
          import { unwrapBingHref } from './serp-utils.js';
          const wrapped='https://www.bing.com/ck/a?!&&p=test&u=a1aHR0cHM6Ly93d3cuaG90ZWxlcy5jb20v&ntb=1';
          const got=unwrapBingHref(wrapped);
          console.log(got);
          if (got !== 'https://www.hoteles.com/') process.exit(1);
          NODE
      - name: Unit test fallback SERP relevance gate
        working-directory: astra-seo-free
        run: |
          node --input-type=module <<'NODE'
          import { serpRowsRelevant } from './serp-utils.js';
          const wrong=[
            {title:'Hoteles en San Antonio',snippet:'Texas hotels',url:'https://example.com/san-antonio'},
            {title:'Booking San Antonio',snippet:'Reserva hoteles',url:'https://example.org/texas'},
            {title:'San Antonio hotel deals',snippet:'Ofertas de hoteles',url:'https://example.net/deals'}
          ];
          const right=[
            {title:'Hoteles en Tarija',snippet:'Reserva en Tarija Bolivia',url:'https://example.com/tarija'},
            {title:'Mejores hoteles Tarija',snippet:'Alojamiento en Tarija',url:'https://example.org/tarija'},
            {title:'Hotel Tarija centro',snippet:'Hoteles y precios en Tarija',url:'https://example.net/tarija'}
          ];
          if (serpRowsRelevant('hoteles tarija', wrong)) process.exit(1);
          if (!serpRowsRelevant('hoteles tarija', right)) process.exit(1);
          NODE
      - name: Start server
        working-directory: astra-seo-free
        run: |
          node server.js > /tmp/astra.log 2>&1 &
          echo $! > /tmp/astra.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          cat /tmp/astra.log
          exit 1
      - name: Verify health contract
        run: |
          curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json
          cat /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(x.version!=='2.0.2'||!x.modules.includes('cpc-hunter')) process.exit(1)"
      - name: Verify frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('astra-seo-free/public/index.html').read_text()
          s=h.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ui.js').write_text(s)
          PY
          node --check /tmp/ui.js
      - name: Verify public network audit
        run: |
          curl -fsS --max-time 30 'http://127.0.0.1:3000/api/audit?url=https%3A%2F%2Fexample.com' > /tmp/audit.json
          cat /tmp/audit.json
          node -e "const x=require('/tmp/audit.json'); if(x.evidence!=='VERIFIED_FROM_LIVE_HTML'||x.canonical!==null) process.exit(1)"
      - name: Verify Bing fallback unwraps outbound URLs
        run: |
          curl -fsS --max-time 60 'http://127.0.0.1:3000/api/serp?q=hoteles%20tarija&lang=es&limit=10' > /tmp/bing-es.json
          cat /tmp/bing-es.json
          node -e "const x=require('/tmp/bing-es.json'); if(x.source==='bing_live_html_fallback' && (x.results||[]).some(r=>{try{return /(^|\\.)bing\\.com$/i.test(new URL(r.url).hostname)}catch{return true}})) process.exit(1)"
      - name: Verify Spanish commercial intent coverage
        run: |
          curl -fsS --max-time 60 'http://127.0.0.1:3000/api/keyword?q=abogado%20tarija&lang=es' > /tmp/es-commercial.json
          cat /tmp/es-commercial.json
          node -e "const x=require('/tmp/es-commercial.json'); if(!(x.commercial_intent_score>0)) process.exit(1)"
      - name: Verify CPC Hunter runtime
        run: |
          curl -fsS --max-time 120 'http://127.0.0.1:3000/api/hunter?q=business%20insurance&lang=en&mode=fast&limit=3' > /tmp/hunter.json
          cat /tmp/hunter.json
          node -e "const x=require('/tmp/hunter.json'); if(!Array.isArray(x.results)||x.results.length<1||!x.methodology) process.exit(1)"
      - name: Verify CPC Hunter deep link signal
        run: |
          curl -fsS --max-time 180 'http://127.0.0.1:3000/api/hunter?q=business%20insurance&lang=en&mode=deep&limit=3' > /tmp/hunter-deep.json
          cat /tmp/hunter-deep.json
          node -e "const x=require('/tmp/hunter-deep.json'); if(!Array.isArray(x.results)||x.results.length<1||!x.results.some(r=>r.top_domain_link_signal)||!x.results.every(r=>r.backlink_gate)) process.exit(1)"
      - name: ASTRA global high-CPC hunt
        run: |
          cat > /tmp/global-hunt.mjs <<'EOF'
          import fs from 'node:fs';
          const targets = [
            {country:'South Africa',lang:'en',query:'financial advisor bloemfontein',value:'VERY_HIGH'},
            {country:'South Africa',lang:'en',query:'attorney bloemfontein',value:'VERY_HIGH'},
            {country:'South Africa',lang:'en',query:'business insurance bloemfontein',value:'VERY_HIGH'},
            {country:'Poland',lang:'pl',query:'adwokat rozwodowy kielce',value:'HIGH'},
            {country:'Poland',lang:'pl',query:'kancelaria podatkowa lublin',value:'HIGH'},
            {country:'Portugal',lang:'pt',query:'advogado divórcio braga',value:'HIGH'},
            {country:'Romania',lang:'ro',query:'servicii financiare credit firme cluj',value:'HIGH'},
            {country:'Romania',lang:'ro',query:'avocat divorț sibiu',value:'HIGH'}
          ];
          const base='http://127.0.0.1:3000';
          const get=async p=>{const r=await fetch(base+p); if(!r.ok) throw new Error(r.status+' '+await r.text()); return r.json()};
          const host=u=>{try{return new URL(u).hostname.replace(/^www\\./,'')}catch{return''}};
          const out=[];
          for(const t of targets){
            const row={...t,candidates:[],errors:[]};
            try{
              const serp=await get('/api/serp?q='+encodeURIComponent(t.query)+'&lang='+encodeURIComponent(t.lang)+'&limit=10');
              row.serp={source:serp.source,partial:serp.partial,evidence:serp.evidence};
              for(const x of (serp.results||[]).slice(0,3)){
                const domain=host(x.url); if(!domain) continue;
                const cc={position:x.position,title:x.title,url:x.url,domain};
                try {
                  const a=await get('/api/audit?url='+encodeURIComponent(x.url));
                  cc.audit={score:a.score,word_count:a.word_count,schema_count:a.schema_count,title:a.title,h1:a.h1,evidence:a.evidence};
                } catch(e){cc.audit={error:String(e)}}
                try {
                  const b=await get('/api/backlinks?domain='+encodeURIComponent(domain)+'&limit=11');
                  cc.links={confirmed_backlinks_min:b.confirmed_backlinks,confirmed_ref_domains_min:b.referring_domains_confirmed,discovered_candidates:b.discovered_candidates,coverage:b.coverage,evidence:b.evidence};
                  cc.gate=b.referring_domains_confirmed>10?'FAIL_CONFIRMED_OVER_10':'CANDIDATE_UNVERIFIED_TOTAL';
                } catch(e){cc.links={error:String(e)};cc.gate='UNVERIFIED'}
                row.candidates.push(cc);
              }
            }catch(e){row.errors.push(String(e))}
            out.push(row);
          }
          const report={generated_at:new Date().toISOString(),engine:'ASTRA SEO Lab 2.0.2',results:out};
          fs.writeFileSync('/tmp/global-hunt.json',JSON.stringify(report,null,2));
          console.log('ASTRA_GLOBAL_HUNT_BEGIN');
          console.log(JSON.stringify(report));
          console.log('ASTRA_GLOBAL_HUNT_END');
          EOF
          node /tmp/global-hunt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-global-hunt
          path: /tmp/global-hunt.json
      - name: ASTRA BetGPT Money SEO hunt
        run: |
          cat > /tmp/betgpt-money-hunt.mjs <<'EOF'
          import fs from 'node:fs';
          const targets = [
            {query:'comparateur de cotes football',lang:'fr'},
            {query:'meilleures cotes football',lang:'fr'},
            {query:'pari du jour football',lang:'fr'},
            {query:'pronostic foot aujourd hui',lang:'fr'},
            {query:'pronostic ligue 1',lang:'fr'},
            {query:'pronostic ligue des champions',lang:'fr'},
            {query:'meilleur site pronostic foot',lang:'fr'},
            {query:'value bet football',lang:'fr'},
            {query:'marge bookmaker',lang:'fr'},
            {query:'probabilite implicite cote',lang:'fr'}
          ];
          const base='http://127.0.0.1:3000';
          const get=async p=>{const r=await fetch(base+p); if(!r.ok) throw new Error(r.status+' '+await r.text()); return r.json()};
          const out=[];
          for (const t of targets) {
            try {
              const x=await get('/api/hunter?q='+encodeURIComponent(t.query)+'&lang='+t.lang+'&mode=deep&limit=3');
              out.push({seed:t.query,status:x.status,results:x.results,methodology:x.methodology});
            } catch (e) {
              out.push({seed:t.query,status:'FAIL',error:String(e)});
            }
          }
          const report={generated_at:new Date().toISOString(),engine:'ASTRA SEO Lab 2.0.2 CPC Hunter',site:'betgpt.live',results:out};
          fs.writeFileSync('/tmp/betgpt-money-hunt.json',JSON.stringify(report,null,2));
          console.log('ASTRA_BETGPT_MONEY_HUNT_BEGIN');
          console.log(JSON.stringify(report));
          console.log('ASTRA_BETGPT_MONEY_HUNT_END');
          EOF
          node /tmp/betgpt-money-hunt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-betgpt-money-hunt
          path: /tmp/betgpt-money-hunt.json
      - name: Package V2 artifact
        run: zip -qr /tmp/astra-seo-lab-v2.zip astra-seo-free
      - uses: actions/upload-artifact@v4
        with:
          name: astra-seo-lab-v2
          path: /tmp/astra-seo-lab-v2.zip
      - name: Server logs
        if: always()
        run: cat /tmp/astra.log || true
