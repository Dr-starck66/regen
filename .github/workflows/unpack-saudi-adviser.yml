name: Unpack Saudi Adviser
on:
  push:
    branches: [saudi-adviser]
    paths:
      - '.bundle/saudi-adviser-v1.tgz'
      - '.github/workflows/unpack-saudi-adviser.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saudi-adviser
      - name: Verify bundle
        run: tar -tzf .bundle/saudi-adviser-v1.tgz >/dev/null
      - name: Unpack site
        run: |
          rm -rf saudi-adviser-site
          tar -xzf .bundle/saudi-adviser-v1.tgz
          test -f saudi-adviser-site/index.html
      - name: Commit extracted site
        run: |
          git config user.name "astra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add saudi-adviser-site
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: unpack Saudi Adviser V1"
          git push origin HEAD:saudi-adviser
