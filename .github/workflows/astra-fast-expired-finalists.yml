name: ASTRA Fast Expired Finalists

on:
  push:
    branches: [astra-seo-free]
    paths:
      - '.github/workflows/astra-fast-expired-finalists.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start ASTRA
        working-directory: astra-seo-free
        run: |
          npm install
          node server.js >/tmp/astra-fast.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
      - name: Check finalists
        run: |
          cat >/tmp/fast.mjs <<'EOF'
          import fs from 'node:fs';
          const domains=['jeddahlawyers.com','jebelalilawyer.com','saudilawonline.com'];
          const base='http://127.0.0.1:3000';
          const rows=[];
          for(const domain of domains){
            const row={domain};
            try{
              const r=await fetch(base+'/api/backlinks?domain='+encodeURIComponent(domain)+'&limit=15');
              row.links=await r.json();
            }catch(e){row.links_error=String(e)}
            try{
              const u='https://web.archive.org/cdx/search/cdx?url='+encodeURIComponent(domain+'/*')+'&output=json&filter=statuscode:200&filter=mimetype:text/html&collapse=digest&fl=timestamp,original&limit=100';
              const r=await fetch(u,{headers:{'user-agent':'Mozilla/5.0 ASTRA-SEO-Lab'}});
              if(r.ok){
                const j=await r.json(); const x=Array.isArray(j)?j.slice(1):[];
                row.wayback={verified:true,snapshots:x.length,first:x[0]?.[0]||null,last:x.at(-1)?.[0]||null,sample:x.slice(0,10)};
              }else row.wayback={verified:false,http_status:r.status};
            }catch(e){row.wayback={verified:false,error:String(e)}}
            rows.push(row);
          }
          fs.mkdirSync('astra-seo-free/research',{recursive:true});
          fs.writeFileSync('astra-seo-free/research/fast-expired-finalists.json',JSON.stringify({generated_at:new Date().toISOString(),rows},null,2));
          console.log(JSON.stringify(rows,null,2));
          EOF
          node /tmp/fast.mjs
      - name: Persist
        run: |
          git config user.name "ASTRA SEO Lab"
          git config user.email "actions@users.noreply.github.com"
          git add astra-seo-free/research/fast-expired-finalists.json
          git diff --cached --quiet || (git commit -m "ASTRA: fast expired domain finalists" && git push origin HEAD:astra-seo-free)
      - uses: actions/upload-artifact@v4
        with:
          name: astra-fast-expired-finalists
          path: astra-seo-free/research/fast-expired-finalists.json
