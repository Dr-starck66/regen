name: Verify Saudi Adviser Railway
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-saudi-adviser-railway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://saudi-adviser-prod-production.up.railway.app"
          for path in "/" "/healthz" "/cities/" "/tabuk/" "/qassim-buraydah/" "/gcc/" "/gcc/uae/dubai/" "/gcc/qatar/doha/" "/gcc/oman/muscat/" "/contact/" "/assets/mobile.js" "/robots.txt" "/sitemap.xml" "/jeddah/compensation-lawyer/"; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$BASE$path")
            echo "$path HTTP $code"
            test "$code" = "200"
            test -s /tmp/body
          done

          curl -L -sS "$BASE/cities/" -o /tmp/cities
          grep -q "16 مدينة" /tmp/cities
          echo "cities content PASS"

          curl -L -sS "$BASE/gcc/" -o /tmp/gcc
          grep -q "الإمارات" /tmp/gcc
          echo "gcc hub content PASS"

          curl -L -sS "$BASE/gcc/qatar/doha/" -o /tmp/qatar
          grep -q "الدوحة" /tmp/qatar
          echo "qatar content PASS"

          curl -L -sS "$BASE/gcc/oman/muscat/" -o /tmp/oman
          grep -q "مسقط" /tmp/oman
          echo "oman content PASS"

          curl -L -sS "$BASE/sitemap.xml" -o /tmp/sitemap
          grep -q "gcc/uae/dubai" /tmp/sitemap
          echo "sitemap GCC PASS"

          curl -L -sS "$BASE/contact/" -o /tmp/contact
          grep -q 'id="leadForm"' /tmp/contact
          curl -L -sS "$BASE/assets/mobile.js" -o /tmp/mobile
          grep -q "/api/leads" /tmp/mobile
          echo "lead frontend wiring PASS"

      - name: Verify real lead POST
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://saudi-adviser-prod-production.up.railway.app"
          lead_code=$(curl -sS -o /tmp/lead.json -w "%{http_code}"             -X POST "$BASE/api/leads"             -H 'Content-Type: application/json'             --data '{"first_name":"AstraTest","country":"SA","city":"Jeddah","topic":"compensation","contact":"qa@example.invalid","consent":"yes","summary":"synthetic QA lead","page":"/qa"}')
          echo "lead POST HTTP $lead_code"
          cat /tmp/lead.json
          test "$lead_code" = "201"
          grep -q '"ok":true' /tmp/lead.json
          grep -q '"id":"L-' /tmp/lead.json
          echo "ASTRA_PUBLIC_AND_LEAD_GATE=PASS"
