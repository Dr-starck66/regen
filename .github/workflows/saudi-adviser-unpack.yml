name: Unpack Saudi Adviser bundle

on:
  push:
    branches: [saudi-adviser]
    paths:
      - '.saudi-adviser-bundle/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saudi-adviser
      - name: Wait for complete bundle
        shell: bash
        run: |
          test -f .saudi-adviser-bundle/part08 || exit 0
          cat .saudi-adviser-bundle/part* | tr -d '\n\r' | base64 -d > /tmp/saudi-adviser-v1.tgz
          rm -rf saudi-adviser-site
          tar -xzf /tmp/saudi-adviser-v1.tgz
          rm -rf .saudi-adviser-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: unpack Saudi Adviser audited V1"
          git push origin HEAD:saudi-adviser
