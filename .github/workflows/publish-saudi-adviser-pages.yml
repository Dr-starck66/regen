name: Publish Saudi Adviser Pages
on:
  push:
    branches: [saudi-adviser]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-saudi-adviser
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Saudi Adviser branch
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Saudi Adviser artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: saudi-adviser-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
